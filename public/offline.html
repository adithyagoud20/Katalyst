<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#09090b">
    <title>KATALYST · Offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #09090b; color: #fafafa; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(520px, 100%); border: 1px solid #27272a; background: #111216; padding: clamp(22px, 5vw, 38px); }
      span { color: #38bdf8; font: 11px ui-monospace, monospace; letter-spacing: .12em; }
      h1 { margin: 12px 0; font-size: clamp(28px, 7vw, 42px); letter-spacing: -.04em; }
      p { color: #e4e4e7; line-height: 1.65; }
      a { display: inline-flex; min-height: 42px; align-items: center; margin-top: 12px; color: #38bdf8; }
    </style>
  </head>
  <body>
    <main>
      <span>KATALYST · CONNECTION PAUSED</span>
      <h1>You’re offline.</h1>
      <p>Reconnect to open lessons, run browser tools, and sync the latest KATALYST version. Your locally saved drafts remain in this browser.</p>
      <a href="/">Try KATALYST again</a>
    </main>
  </body>
</html>
